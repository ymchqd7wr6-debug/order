<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>自助下单</title>
<style>
/* ========== 基础与主题 ========== */
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1f2329; --text-sub:#646a73;
  --border:#e5e6eb; --primary:#2563eb; --primary-soft:#dbeafe;
  --success:#16a34a; --danger:#dc2626; --warn:#f59e0b;
  --radius:14px; --shadow:0 2px 10px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --card:#1a1d24; --text:#e8eaed; --text-sub:#9aa0a6;
    --border:#2a2e37; --primary:#3b82f6; --primary-soft:#1e3a8a;
    --shadow:0 2px 10px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  font-size:16px;line-height:1.5;min-height:100vh}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;outline:none}
input,textarea{font-family:inherit;font-size:16px;outline:none}

/* ========== 全屏容器 ========== */
.screen{position:fixed;inset:0;background:var(--bg);overflow-y:auto;
  padding:16px;display:none;flex-direction:column}
.screen.active{display:flex}

/* ========== 验证页 ========== */
#captcha-screen{justify-content:center;align-items:center}
.captcha-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:28px 22px;width:100%;max-width:380px}
.captcha-title{font-size:18px;font-weight:600;margin-bottom:20px;text-align:center}
.check-row{display:flex;align-items:center;gap:14px;padding:14px;
  border:1.5px solid var(--border);border-radius:10px;cursor:pointer;user-select:none}
.check-row .box{width:26px;height:26px;border:2px solid #9aa0a6;border-radius:6px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:#fff;transition:all .2s}
@media (prefers-color-scheme: dark){.check-row .box{background:#111}}
.check-row.loading .box{border-color:var(--primary)}
.check-row .box.loading::after{content:"";width:16px;height:16px;border:2px solid var(--primary-soft);
  border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.check-row .text{font-size:16px}

.grid-title{font-size:16px;font-weight:600;margin:18px 0 12px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.grid-cell{aspect-ratio:1;background:var(--bg);border:2px solid var(--border);border-radius:10px;
  font-size:44px;display:flex;align-items:center;justify-content:center;transition:all .15s;
  user-select:none}
.grid-cell.selected{border-color:var(--primary);background:var(--primary-soft);transform:scale(1.03)}

.captcha-msg{text-align:center;min-height:22px;font-size:14px;color:var(--danger);margin-bottom:10px}
.btn{display:block;width:100%;min-height:52px;border-radius:12px;font-size:17px;font-weight:600;
  padding:12px 16px;transition:opacity .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{opacity:.85}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--border)}
.btn-success{background:var(--success);color:#fff}

.success-mark{text-align:center;padding:20px 0}
.success-mark .circle{width:72px;height:72px;border-radius:50%;background:var(--success);
  color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;
  margin:0 auto 12px;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}

/* ========== 下单页 ========== */
#order-screen{padding-bottom:80px}
.progress{display:flex;align-items:center;margin:8px 0 20px}
.progress .step{flex:1;text-align:center;font-size:12px;color:var(--text-sub);position:relative}
.progress .step .dot{width:28px;height:28px;border-radius:50%;background:var(--border);
  color:var(--text-sub);display:inline-flex;align-items:center;justify-content:center;
  font-weight:600;margin-bottom:4px}
.progress .step.active .dot{background:var(--primary);color:#fff}
.progress .step.done .dot{background:var(--success);color:#fff}
.progress .bar{flex:0 0 24px;height:2px;background:var(--border);margin:0 -4px 18px}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px;margin-bottom:14px}
.section-title{font-size:17px;font-weight:600;margin:0 0 14px}
.desc{font-size:13px;color:var(--text-sub);margin-top:4px}

.product-btn{display:block;width:100%;text-align:left;background:var(--bg);
  border:2px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;
  min-height:72px;transition:all .15s}
.product-btn:active{border-color:var(--primary);background:var(--primary-soft)}
.product-btn .name{font-size:17px;font-weight:600}
.product-btn .sub{font-size:13px;color:var(--text-sub);margin-top:3px}

.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.opt-btn{background:var(--bg);border:2px solid var(--border);border-radius:10px;
  padding:14px 8px;min-height:50px;font-size:15px;color:var(--text);transition:all .15s}
.opt-btn.selected{background:var(--primary);color:#fff;border-color:var(--primary)}
.opt-btn .price{display:block;font-size:12px;opacity:.8;margin-top:2px}

.qty-row{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px 0}
.qty-btn{width:48px;height:48px;border-radius:50%;background:var(--bg);
  border:2px solid var(--border);font-size:22px;font-weight:600;color:var(--primary)}
.qty-num{font-size:22px;font-weight:600;min-width:50px;text-align:center}

.form-item{margin-bottom:14px}
.form-item label{display:block;font-size:14px;margin-bottom:6px;font-weight:500}
.form-item label .req{color:var(--danger);margin-left:2px}
.form-item input,.form-item textarea{width:100%;padding:12px;border:1.5px solid var(--border);
  border-radius:10px;background:var(--bg);color:var(--text);min-height:48px}
.form-item textarea{min-height:80px;resize:vertical}
.form-item .hint{font-size:12px;color:var(--text-sub);margin-top:4px}

.summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:15px;
  border-bottom:1px dashed var(--border)}
.summary-row:last-child{border-bottom:none}
.summary-row .k{color:var(--text-sub)}
.summary-row .v{font-weight:500;text-align:right;max-width:60%}
.amount-big{font-size:24px;font-weight:700;color:var(--danger);text-align:center;
  padding:14px 0;margin-top:8px}
.amount-quote{font-size:16px;font-weight:600;color:var(--warn);text-align:center;
  padding:14px 0}

.nav-row{display:flex;gap:10px;margin-top:8px}
.nav-row .btn{flex:1}

/* ========== 订单结果页 ========== */
#result-screen{justify-content:flex-start;align-items:stretch;padding-top:40px}
.order-text{background:var(--bg);border-radius:10px;padding:14px;
  font-size:14px;white-space:pre-wrap;word-break:break-all;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;line-height:1.7}
.tip{background:var(--primary-soft);color:var(--text);padding:12px;border-radius:10px;
  font-size:14px;margin:14px 0}
.tip b{color:var(--primary)}

.qr-box{margin-top:14px;text-align:center;display:none}
.qr-box.show{display:block}
.qr-box img{width:220px;max-width:80vw;border-radius:12px;border:1px solid var(--border)}
.qr-box .qr-tip{font-size:14px;color:var(--text-sub);margin-top:10px}
.qr-placeholder{margin-top:14px;padding:18px;border:1.5px dashed var(--border);
  border-radius:10px;font-size:14px;color:var(--text-sub);text-align:center;display:none}
.qr-placeholder.show{display:block}

.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
  background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:20px;
  font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;white-space:nowrap}
.toast.show{opacity:1}

/* ========== 管理入口 & 管理后台 ========== */
.admin-entry{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:50;
  font-size:12px;color:var(--text-sub);opacity:.6;padding:4px 10px;
  background:transparent;cursor:pointer}
.admin-entry:active{opacity:.9}

/* ========== 客服悬浮按钮 & 弹窗 ========== */
.cs-fab{position:fixed;right:16px;bottom:20px;z-index:60;width:56px;height:56px;border-radius:50%;
  background:var(--success);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;border:none}
.cs-fab-label{position:fixed;right:24px;bottom:82px;z-index:60;font-size:12px;color:#fff;
  background:var(--success);padding:2px 8px;border-radius:8px;pointer-events:none}
.cs-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;display:none;
  align-items:flex-end;justify-content:center}
.cs-mask.show{display:flex}
.cs-panel{background:var(--card);width:100%;max-width:420px;border-radius:18px 18px 0 0;
  padding:22px 20px 28px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.cs-panel .cs-title{font-size:18px;font-weight:700;text-align:center;margin-bottom:4px}
.cs-panel .cs-sub{font-size:13px;color:var(--text-sub);text-align:center;margin-bottom:16px}
.cs-panel img{width:200px;max-width:70vw;border-radius:12px;display:block;margin:0 auto 14px}
.cs-panel .cs-wx{text-align:center;font-size:15px;margin-bottom:14px}
.cs-panel .cs-wx b{color:var(--success)}
.cs-panel .cs-actions{display:flex;gap:10px}
.cs-panel .cs-actions .btn{flex:1;min-height:46px;font-size:15px}
.cs-msg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.6;margin-bottom:10px;
  white-space:pre-wrap;word-break:break-word}
.cs-msg.bot{background:var(--card);color:var(--text);border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.cs-msg.me{background:var(--primary);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.cs-quick{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:7px 12px;font-size:13px;color:var(--text);cursor:pointer}
.cs-quick:active{background:var(--primary-soft)}
.admin-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;margin-bottom:12px}
.admin-card h4{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.admin-card h4 .del{font-size:12px;color:var(--danger);background:none;cursor:pointer}
.admin-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.admin-row input,.admin-row select{flex:1;padding:8px 10px;border:1.5px solid var(--border);
  border-radius:8px;font-size:14px;background:var(--bg);color:var(--text)}
.admin-row .price-w{width:80px;flex:0 0 80px}
.admin-row .del-opt{flex:0 0 auto;width:32px;height:32px;border-radius:8px;
  background:var(--bg);color:var(--danger);font-size:16px;cursor:pointer;border:1px solid var(--border)}
.mini-btn{background:var(--bg);border:1.5px dashed var(--border);color:var(--text-sub);
  border-radius:8px;padding:8px;font-size:13px;width:100%;cursor:pointer;margin-top:4px}
.admin-toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-sub);margin:6px 0}
.admin-toggle input{width:16px;height:16px}
.admin-bar{display:flex;gap:8px;margin-top:14px}
.admin-bar .btn{flex:1;min-height:44px;font-size:15px;padding:10px}
.pwd-box{max-width:340px;margin:40px auto}
</style>
</head>
<body>

<!-- ==================== 验证页 ==================== -->
<div class="screen active" id="captcha-screen">
  <div class="captcha-card">
    <div class="captcha-title">安全验证</div>

    <div class="check-row" id="checkRow">
      <div class="box"></div>
      <div class="text">我不是机器人</div>
    </div>

    <div id="quizArea" style="display:none">
      <div class="grid-title" id="quizTitle">请选出所有的【水果】</div>
      <div class="grid" id="grid"></div>
      <div class="captcha-msg" id="captchaMsg"></div>
      <button class="btn btn-primary" id="verifyBtn">验证</button>
    </div>

    <div id="successArea" style="display:none">
      <div class="success-mark">
        <div class="circle">✓</div>
        <div style="font-size:18px;font-weight:600">验证通过</div>
      </div>
    </div>
  </div>
</div>

<!-- ==================== 下单页 ==================== -->
<div class="screen" id="order-screen">
  <div class="progress" id="progress"></div>
  <div id="stepBody"></div>
</div>

<!-- ==================== 结果页 ==================== -->
<div class="screen" id="result-screen">
  <div class="success-mark">
    <div class="circle">✓</div>
    <div style="font-size:20px;font-weight:700">订单已生成</div>
  </div>
  <div class="card">
    <div class="tip">请复制下面订单，发给商家微信 <b id="tipWechat"></b>，商家确认后发付款方式给您。<br>也可以点「邮件发送」把订单发到商家邮箱。</div>
    <div class="order-text" id="orderText"></div>
  </div>
  <button class="btn btn-primary" id="copyBtn" style="margin-bottom:10px">复制订单</button>
  <button class="btn btn-ghost" id="emailBtn" style="margin-bottom:10px">邮件发送给商家</button>
  <button class="btn btn-ghost" id="againBtn">再下一单</button>
</div>

<!-- ==================== 管理入口（不起眼） ==================== -->
<button class="admin-entry" id="adminEntry">管理</button>

<!-- ==================== 管理后台 ==================== -->
<div class="screen" id="admin-screen">
  <div id="adminBody"></div>
</div>

<!-- ==================== 客服悬浮按钮 ==================== -->
<button class="cs-fab" id="csFab" title="咨询客服">💬</button>
<div class="cs-fab-label">客服</div>

<!-- ==================== 客服弹窗（聊天风格） ==================== -->
<div class="cs-mask" id="csMask">
  <div class="cs-panel" style="display:flex;flex-direction:column;height:80vh;max-height:600px;padding:0">
    <!-- 聊天头部 -->
    <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px">
      <div style="width:36px;height:36px;border-radius:50%;background:var(--success);color:#fff;
        display:flex;align-items:center;justify-content:center;font-size:18px">🎧</div>
      <div style="flex:1">
        <div style="font-size:15px;font-weight:600">在线客服</div>
        <div style="font-size:11px;color:var(--success)">● 在线 · 几分钟内回复</div>
      </div>
      <button id="csClose" style="background:none;font-size:20px;color:var(--text-sub);cursor:pointer">✕</button>
    </div>
    <!-- 聊天消息区 -->
    <div id="csChat" style="flex:1;overflow-y:auto;padding:14px;background:var(--bg)">
      <div class="cs-msg bot">您好！欢迎光临，请问有什么可以帮您？请点下方快捷问题，或直接加微信咨询 👇</div>
    </div>
    <!-- 快捷选项 -->
    <div id="csQuick" style="padding:10px 12px;border-top:1px solid var(--border);background:var(--card)">
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <button class="cs-quick" data-q="price">💰 价格多少？</button>
        <button class="cs-quick" data-q="time">⏰ 多久发货？</button>
        <button class="cs-quick" data-q="how">📋 怎么下单？</button>
        <button class="cs-quick" data-q="refund">🔧 售后保障</button>
        <button class="cs-quick" data-q="human">💬 人工客服</button>
      </div>
    </div>
    <!-- 微信引导（隐藏，点人工客服才显示） -->
    <div id="csWxBox" style="display:none;padding:12px;border-top:1px solid var(--border);background:var(--card)">
      <img id="csQR" style="width:180px;border-radius:10px;margin:0 auto 8px;display:block" alt="客服微信二维码">
      <div class="cs-wx" style="text-align:center">微信号：<b id="csWx"></b></div>
      <button class="btn btn-success" id="csCopyWx" style="margin-top:8px;min-height:40px;font-size:14px">复制微信号</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

function $(id){ return document.getElementById(id); }
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove("show"), 1800);
}
function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
// sessionStorage 安全读写
function sGet(k){
  try{ return sessionStorage.getItem(k); }catch(e){ return null; }
}
function sSet(k,v){
  try{ sessionStorage.setItem(k,v); }catch(e){}
}
function sDel(k){
  try{ sessionStorage.removeItem(k); }catch(e){}
}

// 商品数据：优先读 localStorage 里的自定义配置，没有就用默认 CONFIG.products
function getProducts(){
  try{
    const saved = localStorage.getItem("shop_products_v1");
    if(saved){
      const arr = JSON.parse(saved);
      if(Array.isArray(arr) && arr.length){
        // 校验数据结构，坏了就回退默认
        const ok = arr.every(p => p && typeof p.name==="string" && Array.isArray(p.specGroups) &&
          p.specGroups.every(g => Array.isArray(g.options) && g.options.length));
        if(ok) return arr;
      }
      localStorage.removeItem("shop_products_v1"); // 清掉坏数据
    }
  }catch(e){ try{ localStorage.removeItem("shop_products_v1"); }catch(e2){} }
  return CONFIG.products;
}
// 云端订单同步（npoint.io）
const NPOINT_URL = "https://api.npoint.io/7ae23f13af1f05ee64f4";

async function syncOrderToCloud(orderObj){
  try{
    const res = await fetch(NPOINT_URL);
    const data = await res.json();
    const orders = (data && Array.isArray(data.orders)) ? data.orders : [];
    orders.unshift(orderObj);
    await fetch(NPOINT_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ orders })
    });
  }catch(e){ console.log("云端上传失败:", e); }
}

async function fetchOrdersFromCloud(){
  try{
    const res = await fetch(NPOINT_URL);
    const data = await res.json();
    return (data && Array.isArray(data.orders)) ? data.orders : [];
  }catch(e){ return []; }
}
function saveProducts(arr){
  try{ localStorage.setItem("shop_products_v1", JSON.stringify(arr)); return true; }
  catch(e){ toast("保存失败："+e.message); return false; }
}
function resetProducts(){
  try{ localStorage.removeItem("shop_products_v1"); }catch(e){}
}

/* ============================================================
 *  一、真人验证
 * ============================================================ */
const EMOJI = {
  animal:  ["🐱","🐶","🐰","🐼","🦊","🐯"],
  fruit:   ["🍎","🍌","🍇","🍉","🍓","🍊"],
  vehicle: ["🚗","🚌","✈️","🚲","🚢","🚆"],
};
const CAT_LABEL = {animal:"动物", fruit:"水果", vehicle:"交通工具"};
let currentQuiz = null;

function pickQuiz(){
  const cats = Object.keys(EMOJI);
  const target = cats[Math.floor(Math.random()*cats.length)];
  const others = cats.filter(c=>c!==target);
  // 正确项 3-4 个
  const correctCount = 3 + Math.floor(Math.random()*2);
  // 从目标类别抽 correctCount 个
  const targetPool = [...EMOJI[target]].sort(()=>Math.random()-.5).slice(0,correctCount);
  // 错误项从另外两类凑满 9-correctCount
  const wrongPool = [];
  const need = 9 - correctCount;
  while(wrongPool.length < need){
    const c = others[Math.floor(Math.random()*others.length)];
    const pool = EMOJI[c];
    wrongPool.push(pool[Math.floor(Math.random()*pool.length)]);
  }
  const cells = [...targetPool.map(e=>({e,ok:true})), ...wrongPool.map(e=>({e,ok:false}))]
                .sort(()=>Math.random()-.5);
  currentQuiz = { target, cells };
  $("quizTitle").textContent = `请选出所有的【${CAT_LABEL[target]}】`;
  const g = $("grid");
  g.innerHTML = "";
  cells.forEach((c,i)=>{
    const div = document.createElement("div");
    div.className = "grid-cell";
    div.textContent = c.e;
    div.dataset.ok = c.ok ? "1" : "0";
    div.onclick = ()=> div.classList.toggle("selected");
    g.appendChild(div);
  });
  $("captchaMsg").textContent = "";
}

function initCaptcha(){
  $("tipWechat").textContent = CONFIG.wechat;
  // 已验证过直接进下单页
  if(sGet("verified")==="1"){ enterOrder(); return; }

  $("checkRow").onclick = ()=>{
    const row = $("checkRow");
    if(row.classList.contains("loading")) return;
    row.classList.add("loading");
    setTimeout(()=>{
      row.style.display = "none";
      $("quizArea").style.display = "block";
      pickQuiz();
    }, 700);
  };

  $("verifyBtn").onclick = ()=>{
    const cells = document.querySelectorAll("#grid .grid-cell");
    let allRight = true, selectedAny = false;
    cells.forEach(c=>{
      const sel = c.classList.contains("selected");
      if(sel) selectedAny = true;
      if(sel !== (c.dataset.ok==="1")) allRight = false;
    });
    if(!selectedAny){ $("captchaMsg").textContent = "请至少选择一项"; return; }
    if(!allRight){
      $("captchaMsg").textContent = "选择不正确，请重试";
      pickQuiz();
      return;
    }
    // 通过
    sSet("verified","1");
    $("quizArea").style.display = "none";
    $("successArea").style.display = "block";
    setTimeout(enterOrder, 600);
  };
}

function enterOrder(){
  $("captcha-screen").classList.remove("active");
  $("order-screen").classList.add("active");
  renderStep();
}

/* ============================================================
 *  二、下单流程
 * ============================================================ */
const state = {
  step: 1,
  product: null,      // 商品对象
  spec: {},          // {accountType:"全新账号", ...}
  qty: 1,
  contact: "",
  email: "",
  rechargeEmail: "",
  note: "",
  payMethod: "",
};

function renderProgress(){
  const names = ["选商品","选规格","填信息","付款下单"];
  let html = "";
  names.forEach((n,i)=>{
    const idx = i+1;
    const cls = idx<state.step ? "done" : (idx===state.step ? "active" : "");
    const num = idx<state.step ? "✓" : idx;
    html += `<div class="step ${cls}"><div class="dot">${num}</div><div>${n}</div></div>`;
    if(idx<4) html += `<div class="bar"></div>`;
  });
  $("progress").innerHTML = html;
}

function renderStep(){
  renderProgress();
  const body = $("stepBody");
  if(state.step===1) body.innerHTML = step1HTML();
  else if(state.step===2) body.innerHTML = step2HTML();
  else if(state.step===3) body.innerHTML = step3HTML();
  else if(state.step===4) body.innerHTML = step4HTML();
  bindStep();
  window.scrollTo(0,0);
}

/* ---- 第1步 ---- */
function step1HTML(){
  let h = `<div class="card"><div class="section-title">选择商品类型</div>`;
  getProducts().forEach(p=>{
    h += `<button class="product-btn" data-id="${esc(p.id)}">
      <div class="name">${esc(p.name)}</div>
      <div class="sub">${esc(p.sub)}</div>
    </button>`;
  });
  h += `</div>`;
  return h;
}

/* ---- 第2步 ---- */
function step2HTML(){
  const p = state.product;
  let h = `<div class="card"><div class="section-title">${esc(p.name)} · 选规格</div>`;
  p.specGroups.forEach(g=>{
    h += `<div style="font-size:14px;color:var(--text-sub);margin:6px 0 8px">${esc(g.label)}</div>`;
    h += `<div class="option-grid">`;
    g.options.forEach(o=>{
      const selected = state.spec[g.key]===o.label || state.spec[g.key]==="自定义："+o.__customVal;
      h += `<button class="opt-btn ${selected?"selected":""}" data-group="${esc(g.key)}" data-label="${esc(o.label)}" ${o.custom?'data-custom="1"':''}>
        ${esc(o.label)}${o.price?`<span class="price">¥${o.price}</span>`:""}
      </button>`;
    });
    h += `</div>`;
  });
  if(p.showQty){
    h += `<div style="font-size:14px;color:var(--text-sub);margin:10px 0 0">数量</div>
    <div class="qty-row">
      <button class="qty-btn" id="qtyMinus">−</button>
      <div class="qty-num" id="qtyNum">${state.qty}</div>
      <button class="qty-btn" id="qtyPlus">＋</button>
    </div>`;
  }
  h += `</div>
  <div class="nav-row">
    <button class="btn btn-ghost" id="prevBtn">上一步</button>
    <button class="btn btn-primary" id="nextBtn">下一步</button>
  </div>`;
  return h;
}

/* ---- 第3步 ---- */
function step3HTML(){
  const p = state.product;
  let h = `<div class="card"><div class="section-title">填写信息</div>`;
  h += `<div class="form-item"><label>微信号 / 手机号<span class="req">*</span></label>
    <input id="fContact" type="text" placeholder="请输入微信号或手机号" value="${esc(state.contact)}"></div>`;
  h += `<div class="form-item"><label>邮箱（可选）</label>
    <input id="fUserEmail" type="email" placeholder="方便我们通过邮件联系您" value="${esc(state.email)}"></div>`;
  if(p.needEmail){
    h += `<div class="form-item"><label>需要充值的账号（邮箱）<span class="req">*</span></label>
      <input id="fEmail" type="email" placeholder="例如 xxx@gmail.com" value="${esc(state.rechargeEmail)}">
      <div class="hint">请勿在此填写密码，如需登录信息客服会单独与您沟通</div></div>`;
  }
  h += `<div class="form-item"><label>备注（可选）</label>
    <textarea id="fNote" placeholder="有什么特殊要求请写在这里">${esc(state.note)}</textarea></div>`;
  h += `</div>
  <div class="nav-row">
    <button class="btn btn-ghost" id="prevBtn">上一步</button>
    <button class="btn btn-primary" id="nextBtn">下一步</button>
  </div>`;
  return h;
}

/* ---- 第4步 ---- */
function calcAmount(){
  const p = state.product;
  if(!p) return {text:"", quote:false};
  if(!p.showQty) return {text:"单独咨询客服报价", quote:true};
  // 找单价
  let price = 0;
  p.specGroups.forEach(g=>{
    g.options.forEach(o=>{ if(o.label===state.spec[g.key]) price = o.price||0; });
  });
  const total = price * state.qty;
  return {text:`¥${total}.00`, quote:false, price};
}

function specSummaryText(){
  const p = state.product;
  const parts = [];
  p.specGroups.forEach(g=>{
    if(state.spec[g.key]) parts.push(`${g.label}：${state.spec[g.key]}`);
  });
  return parts.join("，");
}

function step4HTML(){
  const p = state.product;
  const amt = calcAmount();
  let h = `<div class="card"><div class="section-title">订单摘要</div>
    <div class="summary-row"><span class="k">顾客编号</span><span class="v" style="color:var(--primary);font-weight:700">${state.custNo}号</span></div>
    <div class="summary-row"><span class="k">商品</span><span class="v">${esc(p.name)}</span></div>
    <div class="summary-row"><span class="k">规格</span><span class="v">${esc(specSummaryText())}</span></div>`;
  if(p.showQty) h += `<div class="summary-row"><span class="k">数量</span><span class="v">${state.qty}</span></div>`;
  h += `<div class="summary-row"><span class="k">联系方式</span><span class="v">${esc(state.contact)}</span></div>`;
  if(state.email)
    h += `<div class="summary-row"><span class="k">邮箱</span><span class="v">${esc(state.email)}</span></div>`;
  if(p.needEmail && state.rechargeEmail)
    h += `<div class="summary-row"><span class="k">充值账号</span><span class="v">${esc(state.rechargeEmail)}</span></div>`;
  if(state.note)
    h += `<div class="summary-row"><span class="k">备注</span><span class="v">${esc(state.note)}</span></div>`;
  if(amt.quote) h += `<div class="amount-quote">单独咨询客服报价</div>`;
  else h += `<div class="amount-big">${amt.text}</div>`;
  h += `</div>`;

  h += `<div class="card"><div class="section-title">付款方式</div>
    <div style="text-align:center;padding:10px 0">
      <div style="font-size:15px;margin-bottom:8px">请复制订单后联系客服微信付款</div>
      <div style="font-size:18px;font-weight:700;color:var(--success)">${esc(CONFIG.wechat)}</div>
      <div style="font-size:13px;color:var(--text-sub);margin-top:6px">付款后把订单号发给客服即可</div>
    </div>
  </div>`;

  h += `<div class="nav-row">
    <button class="btn btn-ghost" id="prevBtn">上一步</button>
    <button class="btn btn-primary" id="genBtn">生成订单</button>
  </div>`;
  return h;
}

/* ---- 事件绑定 ---- */
function bindStep(){
  const p = state.product;

  // step1 商品点击
  document.querySelectorAll(".product-btn").forEach(b=>{
    b.onclick = ()=>{
      state.product = getProducts().find(x=>x.id===b.dataset.id);
      state.spec = {}; state.qty = 1;
      state.step = 2; renderStep();
    };
  });

  // step2 选项
  document.querySelectorAll(".opt-btn[data-group]").forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.custom==="1"){
        const val = prompt("请输入您需要的地区：");
        if(!val || !val.trim()) return;
        state.spec[b.dataset.group] = "自定义：" + val.trim();
      } else {
        state.spec[b.dataset.group] = b.dataset.label;
      }
      renderStep();
    };
  });
  // 数量
  const minus = $("qtyMinus"), plus = $("qtyPlus");
  if(minus) minus.onclick = ()=>{ state.qty = Math.max(1, state.qty-1); $("qtyNum").textContent = state.qty; };
  if(plus) plus.onclick = ()=>{ state.qty = Math.min(99, state.qty+1); $("qtyNum").textContent = state.qty; };

  // 上一步
  const prev = $("prevBtn");
  if(prev) prev.onclick = ()=>{
    state.step = Math.max(1, state.step-1);
    renderStep();
  };

  // 下一步（step2 -> step3）
  const next = $("nextBtn");
  if(next) next.onclick = ()=>{
    if(state.step===2){
      // 校验每个规格组都选了
      for(const g of state.product.specGroups){
        if(!state.spec[g.key]){ toast(`请选择：${g.label}`); return; }
      }
      state.step = 3; renderStep();
    } else if(state.step===3){
      // 收集表单
      state.contact = $("fContact").value.trim();
      state.email = $("fUserEmail").value.trim();
      state.rechargeEmail = $("fEmail") ? $("fEmail").value.trim() : "";
      state.note = $("fNote").value.trim();
      if(!state.contact){ toast("请填写微信号/手机号"); return; }
      if(state.product.needEmail && !state.rechargeEmail){ toast("请填写需要充值的账号邮箱"); return; }
      state.custNo = getCustomerNo();  // 分配今日顾客编号
      state.step = 4; renderStep();
    }
  };

  // step4 支付方式
  const refreshQR = ()=>{
    const box = $("qrBox"), ph = $("qrPlaceholder");
    if(!box) return;
    if(state.payMethod==="微信支付"){
      $("qrImg").src = CONFIG.wechatQR;
      $("qrTipText").textContent = CONFIG.wechatQRTip;
      box.classList.add("show"); ph.classList.remove("show");
    } else if(state.payMethod==="支付宝"){
      $("qrImg").src = CONFIG.alipayQR;
      $("qrTipText").textContent = CONFIG.alipayQRTip;
      box.classList.add("show"); ph.classList.remove("show");
    } else if(state.payMethod){
      box.classList.remove("show"); ph.classList.add("show");
    } else {
      box.classList.remove("show"); ph.classList.remove("show");
    }
  };
  document.querySelectorAll(".opt-btn[data-pay]").forEach(b=>{
    b.onclick = ()=>{ state.payMethod = b.dataset.pay; renderStep(); };
  });
  refreshQR();

  // 生成订单
  const gen = $("genBtn");
  if(gen) gen.onclick = ()=>{
    state.payMethod = "微信联系客服";
    generateOrder();
  };
}

/* ============================================================
 *  三、订单生成
 * ============================================================ */
let lastOrderText = "";

// 每日顾客编号：0点自动重置，从1开始
function getCustomerNo(){
  const today = new Date().toLocaleDateString("zh-CN");
  let rec;
  try{ rec = JSON.parse(localStorage.getItem("shop_cust_no")||"{}"); }catch(e){ rec={}; }
  if(rec.date !== today){ rec = { date: today, count: 0 }; }
  rec.count += 1;
  if(rec.count > 99999) rec.count = 1;
  try{ localStorage.setItem("shop_cust_no", JSON.stringify(rec)); }catch(e){}
  return rec.count;
}

function orderNo(){
  const d = new Date();
  const p = n=>String(n).padStart(2,"0");
  const rand = Math.floor(1000+Math.random()*9000);
  return `D${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${rand}`;
}

function generateOrder(){
  const p = state.product;
  const amt = calcAmount();
  const no = orderNo();
  const custNo = getCustomerNo();
  state.custNo = custNo;
  const lines = [];
  lines.push(`【订单】${no}`);
  lines.push(`顾客编号：${custNo}号`);
  lines.push(`商品：${p.name}`);
  // 规格
  p.specGroups.forEach(g=>{
    lines.push(`${g.label}：${state.spec[g.key]}`);
  });
  if(p.showQty) lines.push(`数量：${state.qty}`);
  if(p.needEmail && state.rechargeEmail) lines.push(`充值账号：${state.rechargeEmail}`);
  lines.push(`联系方式：${state.contact}`);
  if(state.email) lines.push(`邮箱：${state.email}`);
  if(state.note) lines.push(`备注：${state.note}`);
  lines.push(`金额：${amt.text}`);
  lines.push(`付款方式：${state.payMethod}`);
  lastOrderText = lines.join("\n");

  // 上传订单到云端
  const orderObj = {
    no, custNo: custNo+"号", product: p.name,
    spec: specSummaryText(), qty: p.showQty?state.qty:null,
    contact: state.contact, email: state.email||"",
    rechargeEmail: state.rechargeEmail||"", note: state.note||"",
    amount: amt.text, payMethod: state.payMethod,
    status: "pending",
    time: new Date().toLocaleString("zh-CN",{hour12:false})
  };
  syncOrderToCloud(orderObj);

  $("orderText").textContent = lastOrderText;
  $("order-screen").classList.remove("active");
  $("result-screen").classList.add("active");
  window.scrollTo(0,0);
}

function copyOrder(){
  const done = ()=> toast("已复制，请到微信粘贴发送");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(lastOrderText).then(done).catch(()=>fallbackCopy(done));
  } else fallbackCopy(done);
}
function fallbackCopy(cb){
  const ta = document.createElement("textarea");
  ta.value = lastOrderText;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); cb(); }
  catch(e){ toast("复制失败，请长按文字手动复制"); }
  document.body.removeChild(ta);
}

function emailOrder(){
  const subject = encodeURIComponent(`新订单 ${lastOrderText.split("\n")[0]}`);
  const body = encodeURIComponent(lastOrderText + "\n\n—— 来自自助下单页");
  location.href = `mailto:${CONFIG.emailCN}?subject=${subject}&body=${body}`;
  toast("已打开邮件，请发送");
}

function resetAll(){
  state.step = 1; state.product = null; state.spec = {}; state.qty = 1;
  state.contact = ""; state.email = ""; state.rechargeEmail = ""; state.note = ""; state.payMethod = "";
  $("result-screen").classList.remove("active");
  $("order-screen").classList.add("active");
  renderStep();
}

      <h4>商品 #${pi+1} <button class="del" onclick="delProduct(${pi})">删除</button></h4>
      <div class="admin-row"><input id="p${pi}_name" placeholder="商品名" value="${esc(p.name)}"></div>
      <div class="admin-row"><input id="p${pi}_sub" placeholder="副标题/描述" value="${esc(p.sub||'')}"></div>

    p.specGroups.forEach((g,gi)=>{
      h += `<div style="border-top:1px dashed var(--border);padding-top:8px;margin-top:6px">
        <div class="admin-row">
          <input class="grp-label" id="p${pi}_g${gi}_label" placeholder="规格组名（如：地区）" value="${esc(g.label)}">
          <button class="del-opt" onclick="delGroup(${pi},${gi})" title="删规格组">×</button>
        </div>`;
      g.options.forEach((o,oi)=>{
        h += `<div class="admin-row">
          <input class="opt-label" id="p${pi}_g${gi}_o${oi}_label" placeholder="选项名" value="${esc(o.label)}">
          <input class="price-w opt-price" id="p${pi}_g${gi}_o${oi}_price" type="number" placeholder="价格" value="${o.price!=null?o.price:''}">
          <label class="admin-toggle" style="margin:0;flex:0 0 auto" title="勾选后顾客点这个选项会自己输入内容"><input class="opt-custom" type="checkbox" ${o.custom?'checked':''}>自定义</label>
          <button class="del-opt" onclick="delOption(${pi},${gi},${oi})" title="删选项">×</button>
        </div>`;
      });

      </div>`;

    <button class="btn btn-ghost" onclick="exitAdmin()">返回前台</button>

function readAdminForm(){
  // 从 DOM 反向解析出 products 数组
  const cards = $("adminBody").querySelectorAll(".admin-card");
  const products = [];
  cards.forEach((card,pi)=>{
    const p = {
      id: "p_"+Date.now()+"_"+pi,
      name: card.querySelector(`#p${pi}_name`).value.trim(),
      sub: card.querySelector(`#p${pi}_sub`).value.trim(),
      showQty: card.querySelector(`#p${pi}_showQty`).checked,
      needEmail: card.querySelector(`#p${pi}_needEmail`).checked,
      specGroups: []
    };
    // 规格组：按 .grp-label 分组
    const grpLabels = card.querySelectorAll(".grp-label");
    grpLabels.forEach((grpInp,gi)=>{
      const g = { key: "g"+gi, label: grpInp.value.trim()||"选项", options: [] };
      // 选项：在该规格组容器内找 .opt-label 和 .opt-price
      // 结构：每个规格组是一个 div（border-top 那个），但我们没给它打标记，改用 next 兄弟遍历
      // 简单做法：从 grpInp 往上找到父容器（admin-row 的父 div），再在里面找 .opt-label
      const grpWrap = grpInp.closest("div[style*='border-top']") || grpInp.parentElement.parentElement;
      const optLabels = grpWrap.querySelectorAll(".opt-label");
      const optPrices = grpWrap.querySelectorAll(".opt-price");
      const optCusts = grpWrap.querySelectorAll(".opt-custom");
      optLabels.forEach((lb,oi)=>{
        const price = parseFloat(optPrices[oi].value);
        const opt = { label: lb.value.trim()||"选项", price: isNaN(price)?0:price };
        if(optCusts[oi] && optCusts[oi].checked) opt.custom = true;
        g.options.push(opt);
      });
      if(g.options.length) p.specGroups.push(g);
    });
    if(p.name) products.push(p);
  });
  return products;
}

// 用 window 暴露的操作（因为 onclick 内联）
window.delProduct = (pi)=>{
  if(!confirm("确定删除这个商品？")) return;
  const products = readAdminForm();
  products.splice(pi,1);
  saveProducts(products); renderAdmin();
};
window.addProduct = ()=>{
  const products = readAdminForm();
  products.push({ id:"new_"+Date.now(), name:"新商品", sub:"描述", showQty:true, needEmail:false,
    specGroups:[{key:"g0",label:"规格",options:[{label:"选项",price:0}]}] });
  saveProducts(products); renderAdmin();
};
window.addGroup = (pi)=>{
  const products = readAdminForm();
  const g = products[pi].specGroups;
  g.push({ key:"g"+g.length, label:"新规格组", options:[{label:"选项",price:0}] });
  saveProducts(products); renderAdmin();
};
window.delGroup = (pi,gi)=>{
  if(!confirm("删除整个规格组？")) return;
  const products = readAdminForm();
  products[pi].specGroups.splice(gi,1);
  saveProducts(products); renderAdmin();
};
window.addOption = (pi,gi)=>{
  const products = readAdminForm();
  products[pi].specGroups[gi].options.push({label:"新选项",price:0});
  saveProducts(products); renderAdmin();
};
window.delOption = (pi,gi,oi)=>{
  const products = readAdminForm();
  products[pi].specGroups[gi].options.splice(oi,1);
  saveProducts(products); renderAdmin();
};
window.saveAdmin = ()=>{
  const products = readAdminForm();
  if(!products.length){ toast("至少保留一个商品"); return; }
  if(saveProducts(products)){ toast("已保存"); setTimeout(exitAdmin, 600); }
};
window.resetToDefault = ()=>{
  if(!confirm("恢复成默认商品列表？你当前的修改会丢失")) return;
  resetProducts(); renderAdmin(); toast("已恢复默认");
};
window.changePwd = ()=>{
  const oldP = prompt("输入旧密码：");
  if(oldP!==getAdminPwd()){ toast("旧密码错误"); return; }
  const np = prompt("输入新密码：");

  setAdminPwd(np); toast("密码已修改");

/* ---- 订单管理 ---- */
function getOrders(){
  try{ const arr = JSON.parse(localStorage.getItem("shop_orders_v1")||"[]"); return arr; }
  catch(e){ return []; }
}
function persistOrders(arr){
  try{ localStorage.setItem("shop_orders_v1", JSON.stringify(arr)); }catch(e){}
}
window.switchTab = async (t)=>{
  adminTab = t;
  if(t==="orders"){
    $("adminBody").innerHTML = "<div style='text-align:center;padding:40px;color:var(--text-sub)'>正在从云端加载订单...</div>";
    const cloudOrders = await fetchOrdersFromCloud();
    const localOrders = getOrders();
    // 合并：云端在前，本地手动导入的在后（按时间排）
    window._allOrders = cloudOrders.concat(localOrders);
  }
  renderAdmin();
};

function parseOrderText(txt){
  // 解析顾客复制过来的订单文本
  const o = { status:"pending", time:new Date().toLocaleString("zh-CN",{hour12:false}) };
  txt.split("\n").forEach(line=>{
    const [k,...v] = line.split("：");
    if(!v.length) return;
    const val = v.join("：").trim();
    if(k.includes("订单")) o.no = val;
    else if(k.includes("顾客编号")) o.custNo = val;
    else if(k==="商品") o.product = val;
    else if(k==="数量") o.qty = val;
    else if(k==="联系方式") o.contact = val;
    else if(k==="邮箱") o.email = val;
    else if(k==="充值账号") o.rechargeEmail = val;
    else if(k==="备注") o.note = val;
    else if(k==="金额") o.amount = val;
    else if(k==="付款方式") o.payMethod = val;
    else if(!o.spec) o.spec = line.trim();
    else o.spec += "，" + line.trim();
  });
  return o;
}

window.importOrder = ()=>{
  const ta = $("orderImport");
  const txt = ta.value.trim();
  if(!txt){ toast("先粘贴订单内容"); return; }
  const o = parseOrderText(txt);
  const orders = getOrders();
  orders.unshift(o);
  persistOrders(orders);
  ta.value = "";
  toast("订单已录入");
  renderAdmin();
};

window.setOrderStatus = (i, st)=>{
  const orders = getOrders();
  orders[i].status = st;
  persistOrders(orders);
  renderAdmin();
};
window.delOrder = (i)=>{
  if(!confirm("删除这条订单记录？")) return;
  const orders = getOrders();
  orders.splice(i,1);
  persistOrders(orders);
  renderAdmin();
};

function renderOrdersHTML(){
  const orders = window._allOrders || getOrders();
  // 统计
  let totalIncome = 0, pendingCount = 0;
  orders.forEach(o=>{
    if(o.status==="paid"||o.status==="done"){
      const m = parseFloat((o.amount||"").replace(/[^\d.]/g,""));
      if(!isNaN(m)) totalIncome += m;
    }
    if(o.status==="pending") pendingCount++;
  });

  let h = `<div style="display:flex;gap:8px;margin-bottom:12px">
    <div class="admin-card" style="flex:1;text-align:center;margin:0">
      <div style="font-size:22px;font-weight:700">${orders.length}</div>
      <div style="font-size:12px;color:var(--text-sub)">总订单</div>
    </div>
    <div class="admin-card" style="flex:1;text-align:center;margin:0">
      <div style="font-size:22px;font-weight:700;color:var(--warn)">${pendingCount}</div>
      <div style="font-size:12px;color:var(--text-sub)">待付款</div>
    </div>
    <div class="admin-card" style="flex:1;text-align:center;margin:0">
      <div style="font-size:22px;font-weight:700;color:var(--success)">¥${totalIncome}</div>
      <div style="font-size:12px;color:var(--text-sub)">已收金额</div>
    </div>
  </div>`;

  h += `<div class="admin-card">
    <div style="font-size:14px;font-weight:600;margin-bottom:8px">粘贴顾客发来的订单</div>
    <textarea id="orderImport" style="width:100%;min-height:80px;padding:10px;border:1.5px solid var(--border);
      border-radius:8px;background:var(--bg);color:var(--text);font-size:13px"
      placeholder="把顾客微信发你的订单文本粘贴在这里，自动识别"></textarea>
    <button class="mini-btn" onclick="importOrder()">录入这条订单</button>
  </div>`;

  if(!orders.length){
    h += `<div style="text-align:center;color:var(--text-sub);padding:30px 0;font-size:14px">还没有订单记录</div>`;
  }

  const statusMap = { pending:["待付款","var(--warn)"], paid:["已付款","var(--primary)"], done:["已完成","var(--success)"] };
  orders.forEach((o,i)=>{
    const [stName, stColor] = statusMap[o.status]||statusMap.pending;
    h += `<div class="admin-card">
      <h4><span style="color:${stColor};font-size:13px">● ${stName}</span>
        <span style="font-size:11px;color:var(--text-sub);font-weight:400">${esc(o.time||"")}</span>
        <button class="del" onclick="delOrder(${i})">删除</button></h4>
      <div style="font-size:15px;font-weight:600;margin-bottom:4px">
        ${o.custNo?`<span style="color:var(--primary);font-size:13px;margin-right:6px">[${esc(o.custNo)}]</span>`:""}${esc(o.product||"未知商品")}
        <span style="float:right;font-size:16px;font-weight:700">${esc(o.amount||"")}</span></div>
      <div style="font-size:13px;color:var(--text-sub);line-height:1.7">
        ${o.spec?`<div>规格：${esc(o.spec)}</div>`:""}
        ${o.qty?`<div>数量：${esc(o.qty)}</div>`:""}
        ${o.contact?`<div>顾客：${esc(o.contact)}</div>`:""}
        ${o.email?`<div>邮箱：${esc(o.email)}</div>`:""}
        ${o.payMethod?`<div>付款：${esc(o.payMethod)}</div>`:""}
        ${o.note?`<div>备注：${esc(o.note)}</div>`:""}
      </div>
      <div style="display:flex;gap:6px;margin-top:10px">
        ${o.status!=="pending"?`<button class="mini-btn" style="margin:0;flex:1;padding:6px" onclick="setOrderStatus(${i},'pending')">标记待付款</button>`:""}
        ${o.status!=="paid"?`<button class="mini-btn" style="margin:0;flex:1;padding:6px" onclick="setOrderStatus(${i},'paid')">标记已付款</button>`:""}
        ${o.status!=="done"?`<button class="mini-btn" style="margin:0;flex:1;padding:6px" onclick="setOrderStatus(${i},'done')">完成</button>`:""}
      </div>
    </div>`;
  });
  return h;
}

function exitAdmin(){
  $("admin-screen").classList.remove("active");
  $("order-screen").classList.add("active");
  state.step = 1; state.product = null; state.spec = {}; state.qty = 1;
  renderStep();
}

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

});
